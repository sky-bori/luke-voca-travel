<style>
/* Layout: a full-bleed canvas road with a game HUD on top; menus are chunky sticker panels, each lane keeps its own color everywhere. */

#banner{position:absolute;left:50%;top:calc(var(--hu)*50);transform:translateX(-50%) scale(.8);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:calc(var(--hu)*1.2) calc(var(--m)*4);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);background:#fff;text-align:center;width:max-content;max-width:92%;word-break:keep-all;overflow-wrap:break-word;text-wrap:balance}
#banner.show{opacity:1;transform:translateX(-50%) scale(1)}

#combo{position:absolute;left:calc(var(--m)*2.4);top:calc(var(--hu)*9.4);display:flex;flex-direction:column;align-items:center;line-height:1;background:var(--yellow);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:calc(var(--hu)*.8) calc(var(--m)*1.8);font-family:var(--f-en);font-weight:700;transform:rotate(-5deg)}
#combo small{font-size:calc(var(--hu)*2.2);letter-spacing:.1em}
#combo b{font-size:calc(var(--hu)*5.4)}
#combo.bump{animation:pop .3s ease-out}
#tap{position:absolute;inset:0;z-index:2;touch-action:none}
#buffs{position:absolute;left:calc(var(--m)*2.4);top:calc(var(--hu)*24);display:flex;flex-direction:column;gap:calc(var(--hu)*.8);align-items:flex-start;pointer-events:none}
#buffs span{font-family:var(--f-kr);font-size:calc(var(--hu)*2.7);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:0 calc(var(--m)*2);box-shadow:0 3px 0 var(--ink);line-height:1.7}
#hud>#pad{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 calc(var(--m)*2.4) calc(var(--hu)*2.6);pointer-events:none;z-index:6}

.padb{width:calc(var(--m)*17);height:calc(var(--m)*17);border-radius:50%;border:4px solid var(--ink);background:var(--paper);color:var(--ink);font-size:calc(var(--m)*6.5);box-shadow:0 5px 0 var(--ink);opacity:.92;padding:0}

.shot{width:calc(var(--m)*17);height:calc(var(--m)*17);border-radius:50%;border:4px solid var(--ink);background:radial-gradient(circle at 35% 30%,#e98a6b,#b84a52 70%);color:#fff;font-family:var(--f-en);font-weight:700;font-size:calc(var(--m)*3.8);letter-spacing:.04em;box-shadow:0 7px 0 var(--ink);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;padding:0}
.spwrap{position:relative;margin-bottom:calc(var(--m)*1.8);margin-right:calc(var(--m)*3);display:flex;flex-direction:column-reverse;align-items:flex-end;gap:calc(var(--m)*1.4)}
.sppips{display:flex;gap:calc(var(--m)*.7)}.sppips span{position:relative;width:calc(var(--m)*4.8);height:calc(var(--m)*4.8);border-radius:9px;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;box-shadow:0 2px 0 var(--ink)}.sppips i{position:absolute;left:2px;top:-1px;font:700 calc(var(--m)*1.7)/1 var(--f-en);font-style:normal;color:var(--ink2)}.sppips .spic{display:block;width:74%;height:74%}.sppips .spic svg{width:100%;height:100%;display:block}.sppips .nx{background:#fff3b0;outline:3px solid #ffb02e}.sppips .us{opacity:.3;filter:grayscale(1)}.sppips .em{border-style:dashed;opacity:.5;box-shadow:none}
.spbtn{width:calc(var(--m)*11.5);height:calc(var(--m)*11.5);border-radius:50%;border:4px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff7d6,#e7c65a 75%);box-shadow:0 5px 0 var(--ink);padding:0;display:grid;place-items:center;position:relative}
.spbtn .spic{display:block;width:62%;height:62%}.spbtn .spic svg{width:100%;height:100%;display:block}
.spbtn .spn{position:absolute;right:calc(var(--m)*-.8);bottom:calc(var(--m)*-.6);min-width:calc(var(--m)*4.4);height:calc(var(--m)*4.4);padding:0 4px;border-radius:999px;background:var(--ink);color:#fff;font-family:var(--f-en);font-size:calc(var(--m)*2.6);display:grid;place-items:center;border:2px solid #fff}
.spbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.spbtn.off{filter:grayscale(.85);opacity:.7}

.spnext-unused{position:absolute;left:calc(var(--m)*-2.4);top:calc(var(--m)*-1.4);width:calc(var(--m)*5);height:calc(var(--m)*5);border-radius:50%;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:calc(var(--m)*3);padding:0;line-height:1;box-shadow:0 3px 0 var(--ink)}
.shot.on{transform:translateY(5px);box-shadow:0 2px 0 var(--ink);background:radial-gradient(circle at 35% 30%,#ffd57a,#d9ac3e 70%)}
.padup{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:calc(var(--hu)*.8) calc(var(--m)*2.6);border-radius:16px;border:3px solid var(--ink);background:var(--paper2);color:var(--ink);box-shadow:0 4px 0 var(--ink);font-family:var(--f-kr);opacity:.9}
.padup b{font-size:calc(var(--m)*2.7)}.padup small{font-size:calc(var(--m)*2.2);color:var(--ink2)}
.padup.ready{background:var(--coin);opacity:1}
.padup:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#tip{width:max-content;word-break:keep-all;position:absolute;left:50%;bottom:calc(var(--hu)*22);max-width:86%;text-align:center;transform:translateX(-50%);padding:calc(var(--hu)*1.1) calc(var(--m)*3);background:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);font-family:var(--f-kr);font-size:calc(var(--hu)*3.2);pointer-events:none;white-space:normal;animation:bob 1s ease-in-out infinite}
.st .wk{display:flex;align-items:center;gap:calc(var(--m)*.7);font-size:calc(var(--m)*1.8);font-weight:800;color:#7a3d00}

#cfx.show{animation:cfxIn .35s cubic-bezier(.2,1.6,.4,1) forwards}

@keyframes cfxIn{0%{opacity:0;transform:translateX(-50%) scale(.3)}100%{opacity:1;transform:translateX(-50%) scale(1)}}

#upd{position:absolute;left:50%;bottom:calc(var(--m)*2.4);transform:translateX(-50%);z-index:40;white-space:nowrap;animation:bob 1s ease-in-out infinite}

/* typing card */

.ty-slots{--sw:min(calc(var(--hu)*10.4),calc((100cqw - var(--m)*5.6 - var(--n)*var(--m)*.9)/var(--n)));display:flex;gap:calc(var(--m)*.9);justify-content:center;flex-wrap:nowrap}
.slot,.sep{width:var(--sw);height:calc(var(--sw)*1.18);display:grid;place-items:center;font-family:var(--f-en);font-weight:700;font-size:calc(var(--sw)*.72);line-height:1}

/* ---- boss ---- */
function drawBoss(x, y, size, w, hp, maxhp, t, hit, dead) {
  const u = size / 10, sh = hit > 0 ? Math.sin(t * 60) * u * 0.4 : 0, bob = Math.sin(t * 2.4) * u * 0.3;
  ctx.save(); ctx.translate(x + sh, y + bob);

  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, u * 0.3, 5 * u, 0.9 * u, 0, 0, 6.3); ctx.fill();
  drawFigure(w.code, u, t, hit);
  ctx.restore();
  const bw = size * 0.9, bx = x - bw / 2, by = y - size * 1.72;
  rr(bx - 3, by - 3, bw + 6, size * 0.11 + 6, 8); ctx.fillStyle = '#16213a'; ctx.fill();
  rr(bx, by, bw, size * 0.11, 5); ctx.fillStyle = '#4a2a35'; ctx.fill();
  if (hp > 0) { rr(bx, by, bw * (hp / maxhp), size * 0.11, 5); ctx.fillStyle = '#b84a52'; ctx.fill(); }
  txt(FIG[w.code].n, x, by - size * 0.1, size * 0.1, { stroke: '#16213a' });
}

const PT = [];
function addP(p) { PT.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 1, max: 1, size: 6, color: '#fff', kind: 'sq', rot: 0, vr: 0 }, p, { max: p.life || 1 })); if (PT.length > 600) PT.splice(0, 100); }
function updateP(dt) {

    const p = PT[i]; p.life -= dt; if (p.life <= 0) { PT.splice(i, 1); continue; }
    if (p.sw) p.x += Math.sin((p.max - p.life) * p.sw + p.rot) * 38 * dt;
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;

}

function drawP() {
  for (const p of PT) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = p.kind === 'text' ? clamp(a * 2.2, 0, 1) : a;
    if (p.kind === 'text') { txt(p.text, p.x, p.y, p.size, { fill: p.color, stroke: '#16213a' }); }
    else if (p.kind === 'coin') { circ(p.x, p.y, p.size, '#d9ac3e'); ctx.lineWidth = Math.max(1.5, p.size * 0.22); ctx.strokeStyle = '#c98200'; ctx.stroke(); circ(p.x, p.y, p.size * 0.4, '#f0d48a'); }

    else if (p.kind === 'shard') { ctx.globalAlpha = clamp(a * 1.8, 0, 1); ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.drawImage(p.img, p.sx, p.sy, p.sw, p.sh, -p.dw / 2, -p.dh / 2, p.dw, p.dh); ctx.restore(); }
    else if (p.kind === 'leaf') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); const k = p.size / 46; ctx.scale(k, k * (0.55 + 0.45 * Math.abs(Math.cos(p.rot * 0.7)))); ctx.fillStyle = p.color; ctx.fill(MAPLE_P); ctx.lineWidth = 3.4; ctx.strokeStyle = p.c2 || '#7b2414'; ctx.lineJoin = 'round'; ctx.stroke(MAPLE_P); ctx.restore(); }

}
function trailColors(id, t) {

/* ---- 이동 효과: 좌우로 길을 옮길 때 그림자(잔상)와 입자가 남아요 ---- */
function mfxColor(id, hue) {

    case 'bolt': addP({ x: bx + rnd(-12, 12), y: fy, vx: -dir * rnd(30, 120), vy: rnd(-50, 50), life: rnd(0.25, 0.45), size: rnd(7, 13) * sc, color: pick(['#7ae8ff', '#fff', '#b9f3ff']), kind: 'star', rot: rnd(0, 6), vr: rnd(-12, 12) }); break;

function nkImg(id) { // 캐릭터 목에 그릴 그림 (SVG → 이미지, 한 번만 만들어요)
  if (!NK_WORN[id]) return null; let o = NK_IMG[id];
  if (!o) { o = NK_IMG[id] = new Image(); o.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(NK_WORN[id].replace('<svg ', '<svg width="480" height="480" ')); }
  return o.complete && o.naturalWidth ? o : null;
}
function drawNecklace(id, u) { // 캐릭터 좌표(원점=발, 단위 u)에서 목 둘레에 겹쳐 그려요
  const im = nkImg(id); if (!im) return; const k = u / 14.3; ctx.drawImage(im, -60 * k, -6.0 * u - 52 * k, 120 * k, 120 * k);
}

// 경험치 막대가 또르르르 채워지는 연출 (효과음 포함)
function xpAnimate(res) {
  const bar = document.querySelector('.xpbar i'), tot = $('#xp-tot'), rs = $('#xp-rs'), x = res.xp; if (!x) return;
  const rows = document.querySelectorAll('.xp-list .xr'); rows.forEach((el, i) => setTimeout(() => { if (App.mode === 'results') SFX.coin(); }, (0.35 + 0.28 * i) * 1000));
  const t0 = performance.now() + (0.35 + 0.28 * rows.length + 0.25) * 1000, p0 = bar ? +bar.dataset.p0 : 0, p1 = bar ? +bar.dataset.to : 0, D = clamp(1100 + (p1 - p0) * 28, 1200, 3600);
  let lastTick = -1, done = false;
  (function step(now) {
    if (App.mode !== 'results' || !document.body.contains(bar || document.body)) return;
    const k = clamp((now - t0) / D, 0, 1), e = 1 - Math.pow(1 - k, 2.2);
    if (now >= t0) {
      if (bar) bar.style.width = (p0 + (p1 - p0) * e) + '%';
      if (tot) tot.textContent = '+' + fmt(Math.round(x.total * e)) + ' XP';
      if (rs && x) { const cur = Math.round(x.from + x.total * e); rs.innerHTML = `${rs.dataset.nx}까지 <b>${fmt(Math.max(0, +rs.dataset.need - cur))} XP</b> 남았어요 <small>(${fmt(Math.min(cur, +rs.dataset.need))} / ${fmt(+rs.dataset.need)})</small>`; }
      const tk = Math.floor(k * 36); if (tk !== lastTick && k < 1) { lastTick = tk; tone(380 + tk * 22, 0.04, 'square', 0.05); }
    }
    if (k < 1) requestAnimationFrame(step);
    else if (!done) { done = true; if (tot) tot.textContent = '+' + fmt(x.total) + ' XP'; if (bar) { bar.classList.add('pulse-bar'); if (res.rankUp) bar.classList.add('full'); } if (res.rankUp) { SFX.rank(); } else { SFX.star(); } }
  })(performance.now());
}

  },
});

/* ============ 대화창: 나라 소개 · 보스 등장 · 카운트다운 ============ */
const DLG = { open: false, typing: false, timer: 0, full: '', onDone: null };
function dlgType(text) {
  clearInterval(DLG.timer); DLG.full = text; DLG.typing = true; let i = 0; const el = $('#dlg .dlg-text');
  el.textContent = ''; $('#dlg-btn').classList.add('wait');
  DLG.timer = setInterval(() => { i += 1; el.textContent = text.slice(0, i); if (i % 3 === 0) SFX.key(); if (i >= text.length) dlgFinish(); }, 32);
}
function dlgFinish() { clearInterval(DLG.timer); DLG.typing = false; $('#dlg .dlg-text').textContent = DLG.full; $('#dlg-btn').classList.remove('wait'); }
function dlgShow(o) {
  const d = $('#dlg'); d.className = 'dlg ' + (o.kind || '');
  d.querySelector('.dlg-head').innerHTML = o.head; $('#dlg-btn').textContent = o.btn; DLG.onDone = o.onDone; DLG.open = true; d.hidden = false; { const ft = d.querySelector('.dlg-foot'); ft.innerHTML = o.foot || ''; ft.hidden = !o.foot; }
  dlgPrev(o.words ? o.wordList : null);
  dlgType(o.text); if (o.voice) setTimeout(() => { if (DLG.open) sayKo(o.voice.t, o.voice.boss); }, 250);
}
/* 소개 화면 위에 단어 미리보기 (많으면 천천히 자동 스크롤) */
let PREV_RAF = 0;
function dlgPrev(list) {
  cancelAnimationFrame(PREV_RAF); const el = $('#dlg-prev'); if (!el) return;
  if (!list || !list.length) { el.hidden = true; el.innerHTML = ''; return; }
  el.innerHTML = `<div class="dp-t">이번 스테이지 단어 <small>${list.length}개</small></div><div class="dp-sc"><div class="dp-g">${list.map(w => `<span class="dp-w"><b>${esc(w.d)}</b><i>${esc(w.ko)}</i></span>`).join('')}</div></div>`;
  el.hidden = false;
  const sc = el.querySelector('.dp-sc'), card = $('#dlg .dlg-card'); const top = card.getBoundingClientRect().top; sc.style.maxHeight = Math.max(110, top - 150) + 'px';
  let last = performance.now(), wait = 1.4, y = 0;
  (function step(now) {
    if (!DLG.open || el.hidden) return; const dt = Math.min(0.1, (now - last) / 1000); last = now;
    const max = sc.scrollHeight - sc.clientHeight;
    if (max > 4) {
      if (wait > 0) { wait -= dt; if (wait <= 0 && y >= max) { y = 0; sc.scrollTop = 0; wait = 1.4; } }
      else { y = Math.min(max, y + 28 * dt); sc.scrollTop = y; if (y >= max) wait = 1.6; }
    }
    PREV_RAF = requestAnimationFrame(step);
  })(last);
}
function dlgClose() { cancelAnimationFrame(PREV_RAF); { const pv = $('#dlg-prev'); if (pv) pv.hidden = true; } stopSay(); clearInterval(DLG.timer); DLG.open = false; DLG.typing = false; $('#dlg').hidden = true; }

/* 스테이지 시작: 나라 소개 → 3·2·1 */
function openStageDlg() {
  const wi = Wd.world, w = WORLDS[wi], single = R.kind === 'stage' && R.stages.length === 1;
  dlgShow({
    kind: 'stage',
    head: `${flagHTML(wi)}<div><small>${single ? 'STAGE ' + (R.stages[0] + 1) + ' · ' : ''}${esc(w.region)}</small><b>${esc(w.name)}</b></div><span class="dlg-lm">${esc(w.lm)}</span>`,
    words: true, wordList: R.stages.flatMap(si => R.set.stages[si].idx).map(wi => R.set.words[wi]), text: `${INTRO[w.code]} 그럼 달려 볼까?`, btn: '출발!', foot: factsHTML(w.code), voice: { t: INTRO[w.code] },
    onDone() { R.intro = 'count'; R.cdT = 0; R.cdK = -1; },
  });
}
function showCount(txt) {
  const c = $('#count'); c.textContent = txt; c.hidden = false; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); c.classList.toggle('go', isNaN(+txt));
}
function introTick(dt) {
  if (R.intro !== 'count') return;
  R.cdT += dt; const k = Math.floor(R.cdT / 0.8);
  if (k === R.cdK) return; R.cdK = k;
  if (k < 3) { showCount(String(3 - k)); SFX.tap(); }
  else if (k === 3) { showCount('START!'); SFX.go(); }
  else { $('#count').hidden = true; R.intro = 'done'; next(); }
}

/* 보스 등장 */
function openBossDlg() {
  const w = WORLDS[Wd.world], f = FIG[w.code];
  dlgShow({
    kind: 'boss',
    head: `<span class="dlg-tag">BOSS</span><div><small>${esc(f.t)} · 약점 ${esc(weakName(Wd.world))} · 바주카도 강해요</small><b>${esc(f.n)}</b></div>`,
    text: f.line, btn: '도전한다!', voice: { t: f.line, boss: 1 },
    onDone() { const B = R.boss; R.phase = 'boss'; B.state = 'fight'; B.atk = 1.8; R.scrollTarget = 0.4; R.cd = 0; stepBanner(); },
  });
}
Object.assign(ACT, {
  dlgNext() { if (!DLG.open) return; if (DLG.typing) return dlgFinish(); const f = DLG.onDone; dlgClose(); f && f(); },
});

document.addEventListener('input', e => {
  const el = e.target.closest && e.target.closest('.nm'); if (!el) return;
  const st = Store.data.settings; st.names = st.names || ['', '']; st.names[+el.dataset.i] = el.value.slice(0, 8); Store.touch();
});

/* ============ 도전! 승급시험: 지금까지 나온 단어로 예문 빈칸 5문제 ============ */
const EXAM_N = 10, EXAM_PASS = 8, EXAM_COIN = 30;
function examPool() {
  const out = [];
  for (const id in SETS) { const set = SETS[id]; if (!set.words) continue; set.words.forEach(w => { const st = getStat(set, w); if (st[1] > 0 && clozeParts(w)) out.push({ set, wi: w.i }); }); }
  return out;
}
function examBuild() {
  const pool = shuffle(examPool()), qs = [], seen = new Set();
  for (const p of pool) { const k = p.set.id + ':' + p.set.words[p.wi].w; if (seen.has(k)) continue; seen.add(k); const w = p.set.words[p.wi], P = clozeParts(w), co = clozeOpts(p.set, p.wi); qs.push({ w, P, opts: co.opts, correct: co.correct, picked: -1 }); if (qs.length >= EXAM_N) break; }
  return qs;
}
function renderExam() {
  const E = App.exam, col = $('#exam-col'); if (!E) return go('home');
  const from = E.from, to = E.to, head = `<div class="panel ex-head"><div class="ex-pair">${insImg(from, 'ex')}<span class="arr">→</span>${insImg(to, 'ex')}</div><div class="ex-ttl"><b>승급시험</b><small>${RANKS[from].n} → ${RANKS[to].n} · ${E.qs.length}문제 중 ${E.pass}문제 이상 맞히면 통과!</small></div></div>`;
  if (E.done) {
    const pass = E.ok >= E.pass, miss = E.qs.filter(q => q.picked !== q.correct);
    if (pass) {
      const more = examAvail();
      col.innerHTML = `<div class="panel rankup ex-res">승급!<br>${insImg(to, 'up')}<br><b>${RANKS[from].n}</b> → <b>${RANKS[to].n}</b><div class="muted" style="font-size:calc(var(--m)*2.2)">${esc(RANKS[to].d)}</div><div class="ex-note">${E.ok} / ${E.qs.length} 정답 · 코인 +${EXAM_COIN} ${cheer('win') ? '· ' + esc(cheer('win')) : ''}</div>${E.badges && E.badges.length ? `<div class="chips" style="justify-content:center">${E.badges.map(b => `<span class="badge">★ ${esc(b.n)}</span>`).join('')}</div>` : ''}</div>
      <div class="ex-btns">${more ? '<button class="btn primary pulse" data-act="examStart">도전! 다음 승급시험</button>' : ''}<button class="btn ${more ? '' : 'primary'}" data-act="go" data-to="home">홈으로</button></div>`;
    } else {
      col.innerHTML = head + `<div class="panel ex-res"><div class="ex-big">아쉬워요! ${E.ok} / ${E.qs.length}</div><div class="muted">${E.pass}문제 이상 맞히면 통과예요. 틀린 단어를 보고 다시 도전해요! ${cheer('good') ? esc(cheer('good')) : ''}</div>
      ${miss.length ? `<div class="chips ex-miss">${miss.map(q => `<span class="badge">${esc(q.w.d)} = ${esc(q.w.ko)}</span>`).join('')}</div>` : ''}</div>
      <div class="ex-btns"><button class="btn primary" data-act="examStart">다시 도전!</button><button class="btn" data-act="go" data-to="home">홈으로</button></div>`;
    }
    return;
  }
  const q = E.qs[E.i], P = q.P, ans = q.picked >= 0, dots = E.qs.map((x, i) => `<i class="${i < E.i || (i === E.i && ans) ? (x.picked === x.correct ? 'ok' : 'bad') : i === E.i ? 'cur' : ''}"></i>`).join('');
  const sent = ans ? `${esc(P.pre)}<b class="fill">${esc(P.word)}</b>${esc(P.post)}` : `${esc(P.pre)}<span class="blank">_____</span>${esc(P.post)}`;
  col.innerHTML = head + `<div class="panel ex-q"><div class="ex-dots">${dots}<span>${E.i + 1} / ${E.qs.length}</span></div>
    <div class="ex-ko">${esc(P.ko)}</div><div class="ex-sent">${sent}</div>
    <div class="ex-opts">${q.opts.map((t, i) => `<button class="ex-opt ${ans ? (i === q.correct ? 'ok' : i === q.picked ? 'bad' : 'dim') : ''}" data-act="examPick" data-i="${i}" ${ans ? 'disabled' : ''}><em>${i + 1}</em>${esc(t)}</button>`).join('')}</div>
    ${ans ? `<div class="ex-fb ${q.picked === q.correct ? 'ok' : 'bad'}"><b>${q.picked === q.correct ? '정답!' : '아쉬워요'}</b> ${esc(q.w.d)} = ${esc(q.w.ko)}</div>` : '<div class="ex-fb muted">시간 제한 없어요. 천천히 읽고 골라요.</div>'}
    <div class="ex-row"><button class="btn sm" data-act="examSay">🔊 문장 듣기</button>${ans ? `<button class="btn primary" data-act="examNext">${E.i + 1 >= E.qs.length ? '결과 보기' : '다음 →'}</button>` : ''}</div></div>`;
}
Object.assign(ACT, {
  examStart() {
    if (!examAvail()) { toast('아직 승급시험 자격이 없어요'); return; }
    const qs = examBuild(); if (qs.length < 5) { toast('시험에 쓸 단어가 더 필요해요. 먼저 달려서 단어를 만나요!'); return; }
    App.exam = { from: rankIdx(), to: rankIdx() + 1, qs, pass: Math.min(EXAM_PASS, Math.ceil(qs.length * 0.8)), i: 0, ok: 0, done: false };
    go('exam'); if (Store.data.settings.readMode === 'always') { const P = qs[0].P; say(P.pre + ' ... ' + P.post); }
  },
  examPick(d) {
    const E = App.exam; if (!E || E.done) return; const q = E.qs[E.i]; if (q.picked >= 0) return;
    q.picked = +d.i; const ok = q.picked === q.correct; if (ok) E.ok++; ok ? SFX.ok(6) : SFX.bad();
    renderExam(); setTimeout(() => say(q.P.full), 350);
  },
  examSay() { const E = App.exam; if (!E || E.done) return; const q = E.qs[E.i], P = q.P; say(q.picked >= 0 ? P.full : P.pre + ' ... ' + P.post); },
  examNext() {
    const E = App.exam; if (!E) return;
    if (E.i + 1 < E.qs.length) { E.i++; renderExam(); if (Store.data.settings.readMode === 'always') { const P = E.qs[E.i].P; say(P.pre + ' ... ' + P.post); } return; }
    E.done = true;
    if (E.ok >= E.pass) {
      const dd = Store.data; dd.rank = E.to; dd.coins += EXAM_COIN; E.badges = checkBadges(); Store.touch(); Store.flush();
      renderExam(); SFX.rank(); confetti(160);
    } else { SFX.bad(); renderExam(); }
  },
});

/* ============ 보너스 스테이지 퀴즈 화면 (승급시험과 같은 디자인, 총 없이 탭으로 고르기) ============ */
const BQ_PTS = 200, BQ_COIN = 3;
function bqHead() { const B = R.bonus; return `<div class="panel ex-head bq-head"><div class="bq-ico">보너스</div><div class="ex-ttl"><b>보너스 스테이지</b><small>보스를 이긴 보상! 정답 1개마다 +${BQ_PTS}점 · +${BQ_COIN}코인</small></div></div>`; }
function bqRender() {
  const B = R.bonus; if (!B) return; R.phase = 'bonusQ'; R.firing = false; R.q = null; R.gates = []; HUD.hud.hidden = true; HUD.tap.hidden = true; HUD.prompt.hidden = true; padSync();
  $('#scr-bq').hidden = false;
  const q = B.qs[B.i], P = q.P, ans = q.picked >= 0, col = $('#bq-col');
  const dots = B.qs.map((x, i) => `<i class="${i < B.i || (i === B.i && ans) ? (x.picked === x.correct ? 'ok' : 'bad') : i === B.i ? 'cur' : ''}"></i>`).join('');
  const sent = ans ? `${esc(P.pre)}<b class="fill">${esc(P.word)}</b>${esc(P.post)}` : `${esc(P.pre)}<span class="blank">_____</span>${esc(P.post)}`;
  const last = B.i + 1 >= B.n;
  col.innerHTML = bqHead() + `<div class="panel ex-q"><div class="ex-dots">${dots}<span>${B.i + 1} / ${B.n}</span></div>
    <div class="ex-ko">${esc(P.ko)}</div><div class="ex-sent">${sent}</div>
    <div class="ex-opts">${q.opts.map((t, i) => `<button class="ex-opt ${ans ? (i === q.correct ? 'ok' : i === q.picked ? 'bad' : 'dim') : ''}" data-act="bqPick" data-i="${i}" ${ans ? 'disabled' : ''}><em>${i + 1}</em>${esc(t)}</button>`).join('')}</div>
    ${ans ? `<div class="ex-fb ${q.picked === q.correct ? 'ok' : 'bad'}"><b>${q.picked === q.correct ? `정답! +${BQ_PTS}점 +${BQ_COIN}코인` : '아쉬워요'}</b> ${esc(q.w.d)} = ${esc(q.w.ko)}</div>` : '<div class="ex-fb muted">시간 제한 없어요. 천천히 읽고 골라요.</div>'}
    <div class="ex-row"><button class="btn sm" data-act="bqSay">🔊 문장 듣기</button>${ans ? `<button class="btn primary" data-act="bqNext">${last ? '결과 보기' : '다음 →'}</button>` : ''}</div></div>`;
  if (!ans && Store.data.settings.readMode === 'always') say(P.pre + ' ... ' + P.post);
}
function bqSummary() {
  const B = R.bonus; R.phase = 'bonusEnd'; R.bonusN = B.n; R.bonusOk = B.ok; $('#scr-bq').hidden = false; SFX.win(); if (B.ok > 0) confetti(60);
  $('#bq-col').innerHTML = bqHead() + `<div class="panel ex-res bq-sum"><div class="ex-big">보너스 ${B.ok} / ${B.n} 정답!</div>
    <div class="bq-row"><span>+${B.ok * BQ_PTS}점</span><span><i class="bq-coin"></i>+${B.ok * BQ_COIN} 코인</span></div>
    <div class="muted">${B.ok === B.n ? esc(cheer('win') || '모두 맞혔어요!') : '수고했어요! 이제 스테이지 결과를 볼게요.'}</div>
    <div class="ex-btns"><button class="btn primary xl" data-act="bqDone">계속</button></div></div>`;
}
Object.assign(ACT, {
  bqPick(d) {
    const B = R && R.bonus; if (!B || R.phase !== 'bonusQ') return; const q = B.qs[B.i]; if (q.picked >= 0) return;
    q.picked = +d.i; const ok = q.picked === q.correct;
    if (ok) { B.ok++; R.score += BQ_PTS; R.coins += BQ_COIN; bumpStat(q.w, 2, 0, 0); SFX.ok(6); SFX.coin(); } else SFX.bad();
    bqRender(); setTimeout(() => say(q.P.full), 350);
  },
  bqSay() { const B = R && R.bonus; if (!B || R.phase !== 'bonusQ') return; const q = B.qs[B.i]; say(q.picked >= 0 ? q.P.full : q.P.pre + ' ... ' + q.P.post); },
  bqNext() { const B = R && R.bonus; if (!B || R.phase !== 'bonusQ' || B.qs[B.i].picked < 0) return; B.i++; if (B.i >= B.n) bqSummary(); else bqRender(); },
  bqDone() { if (!R || R.phase !== 'bonusEnd') return; $('#scr-bq').hidden = true; endRun(true); },
});

init();
/* ---- 새 버전 자동 확인 (GitHub Pages 등 직접 올린 주소에서만 동작) ---- */
const BUILD = ((document.querySelector('meta[name="app-build"]') || {}).content) || '';
async function checkUpdate(auto) {
  if (!BUILD || !/^https?:$/.test(location.protocol) || !navigator.onLine) return;
  try {
    const r = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
    const m = /name="app-build" content="([^"]+)"/.exec(await r.text()); if (!m || m[1] === BUILD) return;
    let tried = ''; try { tried = sessionStorage.getItem('wr.upd') || ''; } catch (e) { }
    if (auto && tried !== m[1] && App.mode === 'home') { try { sessionStorage.setItem('wr.upd', m[1]); } catch (e) { } return location.reload(); }
    App.updReady = true; $('#upd').hidden = !(App.mode === 'home' && App.screen === 'home');
  } catch (e) { }
}
Object.assign(ACT, { reloadApp() { location.reload(); } });
setTimeout(() => checkUpdate(true), 1500);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(true); });
setInterval(() => checkUpdate(false), 5 * 60 * 1000);
window.__WR = { get R() { return R; }, App, Store, SETS, go, startRun, ACT, setLane, typeKey, judge, initWorld, WORLDS };

</script>
